<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Capítulos TECNM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>Capítulos TECNM</h1>
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
      <label>Correo o usuario</label>
      <input type="text" id="loginIdentificador" required>

      <label>Contraseña</label>
      <input type="password" id="loginContrasena" required>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <p id="loginMsg" class="msg"></p>

    <div class="login-links">
      <a href="registro_admin.html">Registrarse como administrador</a>
      <a href="recuperar_contrasena.html">¿Olvidaste tu contraseña?</a>
    </div>
  </div>

  <script src="funciones.js"></script>
  <script src="login.js"></script>
</body>
</html>
